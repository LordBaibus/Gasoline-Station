name: gasoline_station_app
description: Companion app for the miniature Raspberry Pi-based gasoline station.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  liquid_glass_widgets: ^0.29.6
  flutter_riverpod: ^3.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/gulf_logo.png

flutter_launcher_icons:
  image_path: "assets/images/gulf_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true